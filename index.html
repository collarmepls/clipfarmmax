    <style>
        /* ── reset / base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            overflow-x: hidden;
            color: #fff;
            background: #000;
            min-height: 100vh;
        }

        /* ── overlay ── */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
            transition: opacity 0.6s ease;
            text-align: center;
            user-select: none;
        }
        #overlay .title {
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 700;
            letter-spacing: 0.06em;
            text-shadow: 0 0 12px #fff, 0 0 30px rgba(255, 255, 255, 0.8), 0 0 60px rgba(255, 255, 255, 0.4);
            animation: pulse 2s infinite;
        }
        #overlay .sub {
            margin-top: 1.2rem;
            font-size: clamp(1rem, 3vw, 1.6rem);
            animation: bounce 1.8s infinite;
            opacity: 0.8;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.04);
            }
        }
        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* ── background video ── */
        #bgVideo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        .blur-overlay {
            position: fixed;
            inset: 0;
            backdrop-filter: blur(6px);
            z-index: -1;
            background: rgba(0, 0, 0, 0.35);
        }

        /* ── volume slider ── */
        .volume-slider-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 14px 6px 10px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .volume-slider-container i {
            font-size: 1rem;
            color: #fff;
        }
        #volume-slider {
            width: 80px;
            cursor: pointer;
            accent-color: #fff;
            background: transparent;
        }

        /* ── search ── */
        #search-container {
            display: flex;
            justify-content: center;
            margin: 10px 0 20px;
        }
        #search-input {
            width: 60%;
            max-width: 600px;
            padding: 12px 22px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.13);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        #search-input:focus {
            background: rgba(255, 255, 255, 0.22);
            width: 72%;
        }
        #search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* ── navigation tabs ── */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 10px 0 20px;
            flex-wrap: wrap;
        }
        .nav-tab {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 8px 22px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            text-decoration: none;
            display: inline-block;
        }
        .nav-tab:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }
        .nav-tab.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
        }

        /* ── section dividers ── */
        .section-divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            margin: 40px 10%;
        }
        .section-title {
            text-align: center;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
            margin-bottom: 18px;
            font-weight: 700;
        }

        /* ── name tags ── */
        .names-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 4px 20px 10px;
            gap: 8px;
        }
        .name-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.07);
            padding: 7px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
            font-size: 0.92rem;
            backdrop-filter: blur(2px);
            letter-spacing: 0.3px;
        }
        .name-tag:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* ── clips grid ── */
        .clips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px;
            padding: 0 5% 10px;
            max-width: 1300px;
            margin: 0 auto;
        }
        .clip-card {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 14px;
            padding: 14px 14px 16px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
        }
        .clip-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .clip-card video {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            background: #111;
            margin-bottom: 10px;
            object-fit: cover;
        }
        .clip-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 2px;
            padding: 0 4px;
        }
        .clip-meta {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            padding: 0 4px;
        }

        /* ── image gallery for tweets & screenshots ── */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
            padding: 0 5% 10px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .gallery-item {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 14px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(6px);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gallery-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .gallery-item a {
            display: block;
            width: 100%;
            cursor: pointer;
        }
        .gallery-item img {
            width: 100%;
            border-radius: 10px;
            background: #111;
            display: block;
            transition: opacity 0.2s;
        }
        .gallery-item img:hover {
            opacity: 0.9;
        }
        .gallery-item .gallery-label {
            margin-top: 8px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.5px;
        }

        /* ── page sections (hide/show) ── */
        .page-section {
            display: none;
        }
        .page-section.active {
            display: block;
        }

        /* ── clock ── */
        #clock {
            position: fixed;
            bottom: 22px;
            left: 22px;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 14px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 100;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* ── bed-time popup ── */
        #timeCheckPopup {
            position: fixed;
            bottom: 76px;
            left: 22px;
            background: rgba(200, 30, 30, 0.8);
            padding: 10px 18px;
            border-radius: 30px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 100;
            font-weight: 600;
            animation: shake 0.5s;
            display: none;
            font-size: 0.95rem;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            75% {
                transform: translateX(6px);
            }
        }

        /* ── responsive tweaks ── */
        @media (max-width: 640px) {
            .clips-grid,
            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 18px;
                padding: 0 12px;
            }
            #search-input {
                width: 85%;
            }
            #search-input:focus {
                width: 92%;
            }
            .volume-slider-container {
                top: 12px;
                right: 12px;
                padding: 4px 10px 4px 8px;
            }
            #volume-slider {
                width: 54px;
            }
            .nav-tabs {
                gap: 8px;
            }
            .nav-tab {
                padding: 6px 14px;
                font-size: 0.75rem;
            }
            #clock {
                font-size: 0.8rem;
                padding: 4px 10px;
                bottom: 16px;
                left: 16px;
            }
            #timeCheckPopup {
                font-size: 0.8rem;
                padding: 6px 14px;
                bottom: 66px;
                left: 16px;
            }
        }
    </style>

<body>

    <!-- ═══  JAVASCRIPT  ═══ -->
    <!-- ════════════════════════════════════════════════════ -->
    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const overlay = document.getElementById('overlay');
            const audio = document.getElementById('bgAudio');
            const volumeSlider = document.getElementById('volume-slider');
            const clockEl = document.getElementById('clock');
            const popup = document.getElementById('timeCheckPopup');
            const searchInput = document.getElementById('search-input');
            const userList = document.getElementById('userList');
            const clipList = document.getElementById('clipList');
            const tweetList = document.getElementById('tweetList');
            const screenshotList = document.getElementById('screenshotList');
            const navTabs = document.querySelectorAll('.nav-tab');
            const pageSections = {
                home: document.getElementById('page-home'),
                tweets: document.getElementById('page-tweets'),
                screenshots: document.getElementById('page-screenshots')
            };

            // ─── user names ───
            const names = [
                "Winter / NoSleep",
                "Remorcy",
                "Jay",
                "Ryty",
                "Arkansas",
                "LG / Lunar",
                "Crawlspace",
                "Mr irrelevant",
                "Tech",
                "Gideon",
                "gore"
            ];

            // ─── clip data ───
            const CLIPS_RAW = 'https://raw.githubusercontent.com/trojaninfect/clipfarmmaxxing-clips/main/';

            const clips = [
                { title: "ryty off a gummy", file: "https://files.catbox.moe/6qd77w.mp4" },
                { title: "accidentally burns down entire forest", file: "https://files.catbox.moe/kxqc16.webm" },
                { title: "HELL NAHH", file: CLIPS_RAW + "HELL%20NAHH.webm" },
                { title: "arkansas doubling down", file: CLIPS_RAW + "arkansas%20doubling%20down.webm" },
                { title: "boing", file: CLIPS_RAW + "boing.webm" },
                { title: "discipline", file: CLIPS_RAW + "discipline.webm" },
                { title: "he fell asleep first", file: CLIPS_RAW + "he%20fell%20asleep%20first.webm" },
                { title: "jay keeps saying bs pt1", file: CLIPS_RAW + "jay%20keeps%20saying%20bs%20pt1.webm" },
                { title: "nick fantasises about 2ft dih", file: CLIPS_RAW + "nick%20fantasises%20about%202ft%20dih.webm" },
                { title: "tech - ima shove my dih in my mouth", file: CLIPS_RAW + "tech%20-%20ima%20shove%20my%20dih%20in%20my%20mouth.webm" },
                { title: "trolling 1", file: CLIPS_RAW + "trolling%201.webm" }
            ];

            // ─── tweet images ───
            const tweets = [
                "https://files.catbox.moe/z2l0n8.png",
                "https://files.catbox.moe/bao8vt.png",
                "https://files.catbox.moe/3p8xxd.png",
                "https://files.catbox.moe/8d2t9b.png",
                "https://files.catbox.moe/ytwsgs.png",
                "https://files.catbox.moe/41ylln.png",
                "https://files.catbox.moe/y41vck.png",
                "https://files.catbox.moe/uyg1c4.png",
                "https://files.catbox.moe/cae84x.png",
                "https://files.catbox.moe/obd07i.png",
                "https://files.catbox.moe/5svi9t.png"
            ];

            // ─── screenshot images ───
            const screenshots = [
                "https://files.catbox.moe/mtwaqa.png"
            ];

            // ─── render users ───
            names.forEach(name => {
                const tag = document.createElement('div');
                tag.className = 'name-tag';
                tag.textContent = name;
                userList.appendChild(tag);
            });

            // ─── render clips ───
            clips.forEach(clip => {
                const card = document.createElement('div');
                card.className = 'clip-card';

                const video = document.createElement('video');
                video.src = clip.file;
                video.controls = true;
                video.preload = 'metadata';
                video.playsInline = true;
                video.volume = 1.0;

                const titleEl = document.createElement('div');
                titleEl.className = 'clip-title';
                titleEl.textContent = clip.title;

                const metaEl = document.createElement('div');
                metaEl.className = 'clip-meta';
                metaEl.textContent = 'hosted';

                card.appendChild(video);
                card.appendChild(titleEl);
                card.appendChild(metaEl);
                clipList.appendChild(card);
            });

            // ─── render tweets (clickable images) ───
            tweets.forEach((url, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';

                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';

                const img = document.createElement('img');
                img.src = url;
                img.alt = `Tweet ${index + 1}`;
                img.loading = 'lazy';

                link.appendChild(img);

                const label = document.createElement('div');
                label.className = 'gallery-label';
                label.textContent = `tweet ${index + 1}`;

                item.appendChild(link);
                item.appendChild(label);
                tweetList.appendChild(item);
            });

            // ─── render screenshots (clickable images) ───
            screenshots.forEach((url, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';

                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';

                const img = document.createElement('img');
                img.src = url;
                img.alt = `Screenshot ${index + 1}`;
                img.loading = 'lazy';

                link.appendChild(img);

                const label = document.createElement('div');
                label.className = 'gallery-label';
                label.textContent = `screenshot ${index + 1}`;

                item.appendChild(link);
                item.appendChild(label);
                screenshotList.appendChild(item);
            });

            // ─── routing based on pathname ───
            function getPageFromPath(path) {
                if (path === '/' || path === '') return 'home';
                if (path === '/tweets') return 'tweets';
                if (path === '/screenshots') return 'screenshots';
                return 'home'; // fallback
            }

            function navigateTo(page) {
                // update active tab
                navTabs.forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.page === page);
                });

                // show/hide pages
                Object.keys(pageSections).forEach(key => {
                    pageSections[key].classList.toggle('active', key === page);
                });

                // update search placeholder
                if (page === 'home') {
                    searchInput.placeholder = 'Search users &amp; clips…';
                } else if (page === 'tweets') {
                    searchInput.placeholder = 'Search tweets…';
                } else if (page === 'screenshots') {
                    searchInput.placeholder = 'Search screenshots…';
                }

                // clear search input and reset filters
                searchInput.value = '';
                filterContent('');
            }

            function handleRoute() {
                const path = window.location.pathname;
                const page = getPageFromPath(path);
                navigateTo(page);
            }

            // handle popstate (back/forward)
            window.addEventListener('popstate', handleRoute);

            // click on nav tabs -> update URL with pushState
            navTabs.forEach(tab => {
                tab.addEventListener('click', function(e) {
                    e.preventDefault();
                    const href = this.getAttribute('href');
                    const page = this.dataset.page;
                    // update URL without reload
                    window.history.pushState({ page: page }, '', href);
                    navigateTo(page);
                });
            });

            // initial load: set page from current path
            handleRoute();

            // ─── search function ───
            function filterContent(term) {
                const activePage = document.querySelector('.nav-tab.active');
                if (!activePage) return;
                const page = activePage.dataset.page;

                if (page === 'home') {
                    // filter name tags
                    document.querySelectorAll('.name-tag').forEach(el => {
                        el.style.display = el.textContent.toLowerCase().includes(term) ? 'inline-block' : 'none';
                    });
                    // filter clip cards
                    document.querySelectorAll('.clip-card').forEach(el => {
                        const title = el.querySelector('.clip-title')?.textContent?.toLowerCase() || '';
                        el.style.display = title.includes(term) ? 'flex' : 'none';
                    });
                } else if (page === 'tweets') {
                    // filter tweet gallery items
                    document.querySelectorAll('#tweetList .gallery-item').forEach(el => {
                        const label = el.querySelector('.gallery-label')?.textContent?.toLowerCase() || '';
                        el.style.display = label.includes(term) ? 'flex' : 'none';
                    });
                } else if (page === 'screenshots') {
                    // filter screenshot gallery items
                    document.querySelectorAll('#screenshotList .gallery-item').forEach(el => {
                        const label = el.querySelector('.gallery-label')?.textContent?.toLowerCase() || '';
                        el.style.display = label.includes(term) ? 'flex' : 'none';
                    });
                }
            }

            // ─── search input ───
            searchInput.addEventListener('input', function() {
                const term = this.value.toLowerCase().trim();
                filterContent(term);
            });

            // ─── enter site ───
            window.enterSite = function() {
                overlay.style.opacity = '0';
                const vol = parseFloat(volumeSlider.value) || 1.0;
                audio.volume = vol;
                audio.play().catch(() => {});
                document.querySelectorAll('.clip-card video').forEach(v => {
                    v.volume = vol;
                });
                setTimeout(() => { overlay.style.display = 'none'; }, 550);
            };

            // ─── volume slider ───
            volumeSlider.addEventListener('input', function() {
                const val = parseFloat(this.value) || 0;
                audio.volume = val;
                document.querySelectorAll('.clip-card video').forEach(v => {
                    v.volume = val;
                });
            });

            // ─── clock ───
            function updateClock() {
                const now = new Date();
                clockEl.textContent = now.toLocaleTimeString('en-US', { hour12: false });
            }
            updateClock();
            setInterval(updateClock, 1000);

            // ─── bed-time check ───
            function checkBedTime() {
                const h = new Date().getHours();
                if (h >= 2 && h <= 6) {
                    popup.style.display = 'block';
                    clearTimeout(popup._timer);
                    popup._timer = setTimeout(() => { popup.style.display = 'none'; }, 5000);
                } else {
                    popup.style.display = 'none';
                }
            }
            checkBedTime();
            setInterval(checkBedTime, 60000);

            // ─── click resume ───
            document.addEventListener('click', function() {
                if (overlay.style.display === 'none' && audio.paused) {
                    audio.play().catch(() => {});
                }
            }, { passive: true });

            // ─── set initial volume to full ───
            audio.volume = 1.0;
            document.querySelectorAll('.clip-card video').forEach(v => {
                v.volume = 1.0;
            });

            console.log('🎬 clipfarmmaxxing.lol loaded (volume = FULL)');
            console.log('📁 clips sourced from catbox.moe and the clipfarmmaxxing-clips repo');
        })();
    </script>

</body>
</html>
